name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The integration suite runs against a real Postgres rather than a mocked
    # client: transaction boundaries, unique-constraint races and cross-tenant
    # scoping are exactly the behaviours a mock will happily fake.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: accubook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Build-time placeholders. Real production values come from Vercel project env.
      DATABASE_URL: postgresql://placeholder@localhost:5432/db?sslmode=disable
      AUTH_SECRET: placeholder_secret_at_least_32_chars_long_x
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: test
      # The integration config applies this over DATABASE_URL before the safety
      # guard runs, so CI never has to rewrite the file that aims the live app.
      # The guard still checks it: local host, database named accubook_test.
      TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/accubook_test?schema=public

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Applies the real migration chain, so a migration that is missing,
      # misordered or broken fails here rather than on deploy day.
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
